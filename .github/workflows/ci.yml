name: CI

# PR 리뷰에 red/green 사실 근거를 준다: 빌드가 깨지면 리뷰어가 근거로 블로킹.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
