name: Cleanup preview

# PR 이 닫히면(머지 포함) 그 PR 로 만든 프리뷰 배포를 Vercel 에서 지운다.
# 찾는 기준: deploy.yml 이 프리뷰 배포에 심어둔 `pr=<번호>` 메타.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview deployments of this PR
        env:
          VT: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJ: ${{ secrets.VERCEL_PROJECT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          list=$(curl -sS -H "Authorization: Bearer $VT" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJ&teamId=$ORG&limit=100&meta-pr=$PR")
          # 안전장치: target 이 production 인 배포는 절대 지우지 않는다
          ids=$(printf '%s' "$list" | jq -r '.deployments[]? | select(.target != "production") | .uid')
          if [ -z "$ids" ]; then
            echo "지울 프리뷰 배포 없음 (PR #$PR)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=0
          for id in $ids; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $VT" "https://api.vercel.com/v13/deployments/$id?teamId=$ORG")
            echo "$id → HTTP $code"
            n=$((n+1))
          done
          echo "PR #$PR 프리뷰 배포 $n 건 삭제" >> "$GITHUB_STEP_SUMMARY"
