# GitHub Pages 배포 (S28) — main 푸시마다 프론트를 Pages 로 배포한다.
# API 는 Vercel 서버리스(cake-shop-black.vercel.app)를 그대로 쓴다 — vite.config 의
# 빌드 치환(VITE_BASE·VITE_API_BASE)이 서브패스·절대 API 경로를 만든다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages 미활성 리포에서 첫 실행 시 자동 활성화
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /weirdcakezip/
          VITE_API_BASE: https://cake-shop-black.vercel.app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
