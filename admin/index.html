<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>프롬프트 콘솔 — weirdcake zip</title>
<style>
  :root{
    --paper:#FBF8F3; --panel:#FFFFFF; --sunk:#F5F0E7; --edge:#E7DDCD; --edge-soft:#F0E8DB;
    --ink:#3F2A1D; --body:#5B4636; --dim:#93826F;
    --accent:#C8551F; --accent-soft:#FBEDE3; --ok:#4E7A3A; --warn:#B4342A;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--body); font-size:13px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code{font-family:var(--mono); font-size:.9em; background:var(--sunk); padding:1px 4px; border-radius:3px}
  header{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:13px 20px; background:var(--panel); border-bottom:1px solid var(--edge);
  }
  h1{margin:0; font-size:15px; font-weight:750; color:var(--ink); letter-spacing:-.01em}
  .hint{color:var(--dim); font-size:12px}
  .grid{display:grid; grid-template-columns:200px minmax(0,1fr) minmax(0,390px); height:calc(100vh - 51px)}
  @media (max-width:1120px){ .grid{grid-template-columns:180px minmax(0,1fr)} .tester{display:none} }

  nav{background:var(--panel); border-right:1px solid var(--edge); overflow-y:auto; padding:10px 0}
  .navhead{padding:8px 14px 4px; color:var(--dim); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase}
  nav button{
    display:block; width:100%; text-align:left; background:none; border:0; color:var(--body);
    padding:9px 14px; cursor:pointer; font:inherit; border-left:3px solid transparent;
  }
  nav button:hover{background:var(--sunk)}
  nav button[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent); color:var(--ink)}
  nav .who{display:block; font-weight:650}
  nav .sub{display:block; color:var(--dim); font-size:11px; font-family:var(--mono)}
  .dot{color:var(--accent)}

  main{overflow-y:auto; padding:18px 22px}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
  .tabs button{
    background:var(--panel); border:1px solid var(--edge); color:var(--dim); border-radius:7px;
    padding:6px 13px; cursor:pointer; font:inherit;
  }
  .tabs button[aria-selected="true"]{background:var(--accent-soft); color:var(--ink); border-color:var(--accent)}
  label{display:block; margin:16px 0 5px; color:var(--dim); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase}
  textarea, input[type=text], input[type=number], select{
    width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--edge);
    border-radius:7px; padding:9px 11px; font-family:var(--mono); font-size:12px; line-height:1.65;
    resize:vertical;
  }
  select, input[type=number]{font-family:inherit; font-size:12.5px}
  textarea:focus, input:focus, select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .row{display:flex; gap:6px; align-items:flex-start; margin-bottom:6px}
  .row textarea{flex:1}
  .row .idx{color:var(--dim); font-family:var(--mono); padding-top:9px; width:16px; flex:none}
  .bar{display:flex; gap:8px; align-items:center; margin:18px 0 6px; flex-wrap:wrap;
       position:sticky; bottom:0; background:var(--paper); padding:10px 0; border-top:1px solid var(--edge-soft)}
  .btn{background:var(--accent); color:#fff; border:0; border-radius:7px; padding:8px 17px; cursor:pointer; font:inherit; font-weight:700}
  .btn.ghost{background:var(--panel); color:var(--dim); border:1px solid var(--edge); font-weight:400}
  .btn:disabled{opacity:.45; cursor:default}
  .status{color:var(--ok); font-size:12px}
  .status.warn{color:var(--warn)}
  #tpl{height:calc(100vh - 250px); min-height:340px}
  pre.preview{
    background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:13px;
    font-family:var(--mono); font-size:11.5px; line-height:1.62; white-space:pre-wrap;
    word-break:break-word; max-height:72vh; overflow-y:auto; color:var(--ink);
  }
  pre.preview mark{background:#FDF0C8; color:#6B4A12; border-radius:3px; padding:0 2px}

  /* 정답 편집 — 3상태(상관없음 / 없음 / 지정)를 눈에 보이게 */
  .slot{border:1px solid var(--edge); border-radius:9px; padding:11px 13px; margin-bottom:9px; background:var(--panel)}
  .slot-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .slot-name{font-weight:650; color:var(--ink); min-width:74px}
  .seg{display:inline-flex; border:1px solid var(--edge); border-radius:7px; overflow:hidden}
  .seg button{background:var(--panel); border:0; border-right:1px solid var(--edge); color:var(--dim);
              padding:4px 11px; cursor:pointer; font:inherit; font-size:12px}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:700}
  .slot-body{margin-top:10px}
  .slot-body:empty{display:none}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chips label{margin:0; text-transform:none; letter-spacing:0; font-size:12.5px; color:var(--body);
               border:1px solid var(--edge); border-radius:999px; padding:4px 11px; cursor:pointer; background:var(--panel)}
  .chips input{display:none}
  .chips input:checked + span{font-weight:700; color:var(--accent)}
  .chips label:has(input:checked){background:var(--accent-soft); border-color:var(--accent)}
  .decorow{display:flex; gap:6px; align-items:center; margin-bottom:6px}
  .decorow select{flex:1}
  .decorow input{width:78px}
  .why{color:var(--dim); font-size:11.5px; margin:4px 0 0}
  .legend{background:var(--sunk); border-radius:8px; padding:10px 13px; margin-bottom:12px; font-size:12px}
  .legend b{color:var(--ink)}

  .tester{background:var(--panel); border-left:1px solid var(--edge); display:flex; flex-direction:column; min-height:0}
  .tester h2{margin:0; padding:14px 16px 8px; font-size:10.5px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase}
  .log{flex:1; overflow-y:auto; padding:0 16px 10px; display:flex; flex-direction:column; gap:8px}
  .msg{padding:8px 12px; border-radius:11px; max-width:92%; white-space:pre-wrap}
  .msg.monster{background:var(--sunk); align-self:flex-start; border-top-left-radius:3px; color:var(--ink)}
  .msg.user{background:var(--accent-soft); align-self:flex-end; border-top-right-radius:3px; color:var(--ink)}
  .msg.sys{background:none; color:var(--dim); align-self:center; font-size:11.5px; text-align:center}
  .intent{align-self:flex-start; max-width:96%; margin:-3px 0 2px; display:flex; flex-wrap:wrap; gap:4px}
  .i-slot{font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:5px;
          border:1px solid var(--edge); background:var(--paper); color:var(--dim)}
  .i-slot b{font-family:inherit; font-weight:700; margin-right:4px}
  .i-slot.got{background:#EAF3E4; border-color:#B9D3AA; color:#3D6130}   /* 확인됨 */
  .i-slot.unk{opacity:.65}                                              /* 아직 */
  .i-slot.care{background:var(--sunk); color:#8A7A66}                   /* 상관없음 */
  .i-slot.non{background:#FDF0C8; border-color:#E6CE84; color:#6B4A12}  /* 없음 */
  .intent.bad{align-self:flex-start; padding:6px 10px; border:1px dashed var(--warn);
              border-radius:8px; color:var(--warn); font-size:11px}
  .ask{display:flex; gap:6px; padding:10px 16px; border-top:1px solid var(--edge)}
  .ask input{flex:1}
</style>
</head>
<body>
<header>
  <h1>프롬프트 콘솔</h1>
  <span class="hint">로컬 전용 · 편집본은 <code>prompt-overrides.json</code> 에 저장되고 <code>orders.js</code> 원본은 안 건드립니다. 저장 즉시 대화·채점에 반영됩니다(재시작 불필요).</span>
</header>

<div class="grid">
  <nav>
    <div class="navhead">공통</div>
    <button data-view="template"><span class="who">규칙 템플릿</span><span class="sub">모든 손님 공용</span></button>
    <div class="navhead">손님 (플레이 순서)</div>
    <div id="orderNav"></div>
    <div class="navhead">몬스터 (종 설정)</div>
    <div id="monsterNav"></div>
  </nav>

  <main id="main"></main>

  <section class="tester">
    <h2>대화 시험 <span id="testWho" class="hint"></span></h2>
    <div class="log" id="log"></div>
    <div class="ask">
      <input type="text" id="ask" placeholder="주인으로 물어보기…" />
      <button class="btn" id="askBtn">보내기</button>
    </div>
    <div class="ask" style="border-top:0; padding-top:0">
      <button class="btn ghost" id="clearBtn" style="flex:1">대화 비우기</button>
    </div>
  </section>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
let S = null, view = "template", curId = null, curMid = null, history = [], draftWants = null;

const api = async (p, body) => {
  const r = await fetch(p, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error([j.error, (j.detail ?? []).join(" / ")].filter(Boolean).join(" — ") || r.status);
  return j;
};
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const order = () => S.orders.find((o) => o.id === curId);

async function load() {
  S = await api("/api/admin/state");
  if (!curId) curId = S.orders[0].id;
  renderNav(); render();
}

function renderNav() {
  $("#monsterNav").innerHTML = S.monsters.map((m) => `
    <button data-view="monster" data-mid="${m.id}">
      <span class="who">${esc(m.id)}${m.edited ? ' <span class="dot">●</span>' : ""}</span>
      <span class="sub">${m.usedBy.length ? m.usedBy.join(" · ") : "주문 없음"}</span>
    </button>`).join("");
  $("#orderNav").innerHTML = S.orders.map((o) => `
    <button data-view="order" data-id="${o.id}">
      <span class="who">${o.seq}. ${esc(o.monster)}${o.edited ? ' <span class="dot">●</span>' : ""}</span>
      <span class="sub">${o.id}</span>
    </button>`).join("");
  document.querySelectorAll("nav button").forEach((b) => {
    const on = b.dataset.view === "template" ? view === "template"
      : b.dataset.mid ? (view === "monster" && b.dataset.mid === curMid)
      : (view === "order" && b.dataset.id === curId);
    b.setAttribute("aria-current", String(on));
    b.onclick = () => {
      view = b.dataset.view;
      if (b.dataset.id) { curId = b.dataset.id; history = []; draftWants = null; }
      if (b.dataset.mid) curMid = b.dataset.mid;
      renderNav(); render();
    };
  });
  const t = document.querySelector('nav button[data-view="template"] .who');
  if (S.templateEdited) t.innerHTML = '규칙 템플릿 <span class="dot">●</span>';
}

function render() {
  $("#testWho").textContent = view === "order" ? `— ${order().monster}` : "— 손님을 고르세요";
  if (view === "template") renderTemplate();
  else if (view === "monster") renderMonster();
  else renderOrder();
  drawLog();
}

function renderTemplate() {
  $("#main").innerHTML = `
    <div class="tabs"><button aria-selected="true">규칙 템플릿 (모든 손님 공용)</button></div>
    <p class="hint">손님마다 다른 건 값뿐이고 규칙은 하나입니다. <code>{{persona}}</code> <code>{{intent}}</code>
       <code>{{answer}}</code> <code>{{dontcare}}</code> <code>{{ladder}}</code> 자리에 손님별 값이 들어갑니다.</p>
    <label>템플릿</label>
    <textarea id="tpl" rows="40">${esc(S.template)}</textarea>
    <div class="bar">
      <button class="btn" id="save">저장</button>
      <button class="btn ghost" id="reset">기본값으로</button>
      <span class="status" id="msg"></span>
    </div>`;
  $("#save").onclick = () => save({ template: $("#tpl").value });
  $("#reset").onclick = () => {
    if (confirm("템플릿을 기본값으로 되돌릴까요? 편집 내용이 사라집니다.")) save({ template: S.templateDefault });
  };
}

const CHAR_FIELDS = [
  ["personality", "성향", "이 종의 기본 온도. 손님별 화법(성격)이 우선이라 비워둬도 된다"],
  ["favorite", "좋아하는 것", "쉼표로 나열"],
  ["dislike", "싫어하는 것", "쉼표로 나열"],
  ["background", "배경", "어디서 왔고 무엇을 바라는지"],
];

function renderMonster() {
  const m = S.monsters.find((x) => x.id === curMid) ?? S.monsters[0];
  curMid = m.id;
  $("#main").innerHTML = `
    <div class="tabs"><button aria-selected="true">${esc(m.id)} — 종 설정</button></div>
    <p class="hint">${m.usedBy.length
        ? `이 스프라이트를 쓰는 주문: <code>${m.usedBy.join("</code> <code>")}</code>.
           손님별 화법은 각 주문의 <b>성격(persona)</b> 이 정하고, 여기 배경은 양념으로만 들어갑니다.`
        : "아직 주문이 없는 몬스터입니다. 설정만 잡아두면 나중에 주문을 붙일 때 그대로 씁니다."}</p>
    ${CHAR_FIELDS.map(([k, ko, why]) => `
      <label>${ko}</label>
      <textarea id="c_${k}" rows="${k === "background" ? 4 : 2}">${esc(m.character[k] ?? "")}</textarea>
      <p class="why">${why}</p>`).join("")}
    <div class="bar">
      <button class="btn" id="save">저장</button>
      <button class="btn ghost" id="reset">되돌리기</button>
      <span class="status" id="msg"></span>
    </div>`;
  $("#save").onclick = () => save({ monsterId: m.id,
    fields: Object.fromEntries(CHAR_FIELDS.map(([k]) => [k, $(`#c_${k}`).value.trim()])) });
  $("#reset").onclick = async () => {
    if (!confirm("이 몬스터 설정을 되돌릴까요?")) return;
    await api("/api/admin/reset", { monsterId: m.id });
    await load();
  };
}

function renderOrder() {
  const o = order();
  draftWants ??= structuredClone(o.wants ?? {});
  $("#main").innerHTML = `
    <div class="tabs">
      <button data-tab="fields" aria-selected="true">손님 값</button>
      <button data-tab="wants">정답</button>
      <button data-tab="preview">완성된 프롬프트</button>
    </div>
    <div id="tab"></div>`;
  const tabs = { fields: tabFields, wants: tabWants, preview: tabPreview };
  document.querySelectorAll(".tabs button").forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
      tabs[b.dataset.tab](order());
    };
  });
  tabFields(o);
}

const hintRow = (h, i) => `<div class="row"><span class="idx">${i + 1}</span><textarea rows="2">${esc(h)}</textarea></div>`;

function tabFields(o) {
  $("#tab").innerHTML = `
    <p class="hint">성격(화법)은 몬스터의 것입니다 — 왼쪽 <b>몬스터 (종 설정)</b> 에서 고칩니다.</p>
    <label>첫 대사 (dialogue)</label>
    <textarea id="dialogue" rows="2">${esc(o.dialogue)}</textarea>
    <label>힌트 사다리 — 위에서 아래로 구체적</label>
    <div id="hints">${o.hints.map(hintRow).join("")}</div>
    <button class="btn ghost" id="addHint">힌트 추가</button>
    <div class="bar">
      <button class="btn" id="save">저장</button>
      <button class="btn ghost" id="reset">이 손님 되돌리기</button>
      <span class="status" id="msg"></span>
    </div>`;
  $("#addHint").onclick = () =>
    $("#hints").insertAdjacentHTML("beforeend", hintRow("", $("#hints").children.length));
  $("#save").onclick = () => save({ orderId: o.id, fields: {
    dialogue: $("#dialogue").value,
    hints: [...document.querySelectorAll("#hints textarea")].map((t) => t.value.trim()).filter(Boolean),
  }});
  $("#reset").onclick = () => resetOrder(o);
}

// ── 정답 편집 ────────────────────────────────────────────────
// 세 상태를 반드시 구분한다:
//   상관없음 = wants 에 키가 아예 없음(don't-care) → 무엇을 올려도 감점 없음
//   없음     = 키는 있고 값이 빔 → 올리면 감점, 손님이 "필요 없어"라고 답한다
//   지정     = 값이 있음
const SLOTS = [
  { key: "base",       name: "시트반죽", none: false },
  { key: "sheetColor", name: "케이크 맛", none: false },
  { key: "toppings",   name: "토핑",     none: true },
  { key: "cream",      name: "생크림",   none: true },
  { key: "deco",       name: "데코",     none: true },
  { key: "lettering",  name: "레터링",   none: true },
];

const stateOf = (w, s) => {
  if (!(s.key in w)) return "care";
  const v = w[s.key];
  if (s.key === "cream") return v == null ? "none" : "set";
  if (s.key === "lettering") return (v?.text ?? "") === "" ? "none" : "set";
  if (Array.isArray(v)) return v.length === 0 ? "none" : "set";
  return "set";
};

function setState(s, st) {
  const w = draftWants;
  if (st === "care") { delete w[s.key]; return; }
  if (st === "none") {
    w[s.key] = s.key === "cream" ? null : s.key === "lettering" ? { text: "", color: null } : [];
    return;
  }
  if (stateOf(w, s) === "set") return;
  w[s.key] = s.key === "base" ? ["flour", "milk", "egg", "butter"]
    : s.key === "sheetColor" ? S.vocab.colors[0].id
    : s.key === "cream" ? { color: S.vocab.colors[0].id }
    : s.key === "lettering" ? { text: "축하해", color: null }
    : s.key === "deco" ? [{ type: S.vocab.deco[0].id, count: 1 }]
    : [S.vocab.toppings[0].id];
}

function tabWants(o) {
  $("#tab").innerHTML = `
    <div class="legend">
      <b>상관없음</b> = 채점에서 빠진다(무엇을 올려도 감점 없음) ·
      <b>없음</b> = 올리면 감점, 손님이 “필요 없어”라고 답한다 ·
      <b>지정</b> = 이 값이어야 정답<br />
      <span class="hint">이 둘을 헷갈리면 “왜 0점?”이 됩니다. 저장하면 대화와 채점에 모두 반영됩니다.</span>
    </div>
    <div id="slots">${SLOTS.map(slotHtml).join("")}</div>
    <label>프롬프트에 들어가는 정답 — 손님이 출력할 intent 와 같은 모양</label>
    <pre class="preview" id="answerJson" style="max-height:none">${esc(JSON.stringify(o.answer, null, 2))}</pre>
    <p class="why">주인이 다 알아내면 손님의 intent 가 이것과 같아집니다.
       <code>"dont care"</code> = 상관없음 · <code>"none"</code> = 없어야 함 · 그 외 = 정답 값.</p>
    <div class="bar">
      <button class="btn" id="save">저장</button>
      <button class="btn ghost" id="reset">이 손님 되돌리기</button>
      <span class="status" id="msg"></span>
    </div>`;
  bindSlots();
  $("#save").onclick = () => save({ orderId: o.id, fields: { wants: draftWants } });
  $("#reset").onclick = () => resetOrder(o);
}

function slotHtml(s) {
  const st = stateOf(draftWants, s);
  const seg = [["care", "상관없음"], s.none ? ["none", "없음"] : null, ["set", "지정"]].filter(Boolean);
  return `<div class="slot" data-key="${s.key}">
    <div class="slot-head">
      <span class="slot-name">${s.name}</span>
      <span class="seg">${seg.map(([v, l]) =>
        `<button data-st="${v}" aria-pressed="${st === v}">${l}</button>`).join("")}</span>
    </div>
    <div class="slot-body">${st === "set" ? slotBody(s) : ""}</div>
  </div>`;
}

function slotBody(s) {
  const v = draftWants[s.key];
  const chips = (list, sel, multi) => `<div class="chips">${list.map((x) => `
    <label><input type="${multi ? "checkbox" : "radio"}" name="${s.key}" value="${x.id}"
      ${(multi ? sel.includes(x.id) : sel === x.id) ? "checked" : ""} /><span>${x.emoji ?? ""} ${esc(x.label)}</span></label>`).join("")}</div>`;

  if (s.key === "base") return chips(S.vocab.base, v ?? [], true);
  if (s.key === "sheetColor") return chips(S.vocab.colors, v, false);
  if (s.key === "toppings") return chips(S.vocab.toppings, v ?? [], true)
    + `<p class="why">여러 개면 그 조합이 정답입니다. 여분을 올리면 감점됩니다.</p>`;
  if (s.key === "cream") return chips(S.vocab.colors, v?.color, false);
  if (s.key === "lettering") return `<input type="text" id="letText" value="${esc(v?.text ?? "")}" placeholder="케이크에 쓸 글자" />`;
  if (s.key === "deco") return (v ?? []).map((d, i) => `
    <div class="decorow" data-i="${i}">
      <select>${S.vocab.deco.map((x) => `<option value="${x.id}" ${x.id === d.type ? "selected" : ""}>${x.emoji} ${esc(x.label)}</option>`).join("")}</select>
      <input type="number" min="1" value="${d.count ?? 1}" />
      <button class="btn ghost" data-del="${i}">삭제</button>
    </div>`).join("") + `<button class="btn ghost" id="addDeco">데코 추가</button>
    <p class="why">배치한 <b>개수</b>까지 정답과 같아야 만점입니다.</p>`;
  return "";
}

function bindSlots() {
  document.querySelectorAll(".slot").forEach((el) => {
    const s = SLOTS.find((x) => x.key === el.dataset.key);
    el.querySelectorAll(".seg button").forEach((b) => {
      b.onclick = () => { setState(s, b.dataset.st); redrawSlots(); };
    });
    el.querySelectorAll(".chips input").forEach((inp) => {
      inp.onchange = () => {
        const picked = [...el.querySelectorAll(".chips input:checked")].map((i) => i.value);
        if (s.key === "base") draftWants.base = picked;
        else if (s.key === "toppings") draftWants.toppings = picked;
        else if (s.key === "sheetColor") draftWants.sheetColor = inp.value;
        else if (s.key === "cream") draftWants.cream = { color: inp.value };
      };
    });
    const lt = el.querySelector("#letText");
    if (lt) lt.oninput = () => { draftWants.lettering = { text: lt.value, color: null }; };
    el.querySelectorAll(".decorow").forEach((r) => {
      const i = +r.dataset.i;
      r.querySelector("select").onchange = (e) => { draftWants.deco[i].type = e.target.value; };
      r.querySelector("input").oninput = (e) => { draftWants.deco[i].count = Math.max(1, +e.target.value || 1); };
      r.querySelector("[data-del]").onclick = () => { draftWants.deco.splice(i, 1); redrawSlots(); };
    });
    const add = el.querySelector("#addDeco");
    if (add) add.onclick = () => { draftWants.deco.push({ type: S.vocab.deco[0].id, count: 1 }); redrawSlots(); };
  });
}

function redrawSlots() {
  $("#slots").innerHTML = SLOTS.map(slotHtml).join("");
  bindSlots();
}

function tabPreview(o) {
  let html = esc(o.prompt);
  for (const v of Object.values(o.parts)) {
    const s = esc(String(v));
    if (s.trim()) html = html.split(s).join(`<mark>${s}</mark>`);
  }
  $("#tab").innerHTML = `
    <p class="hint">규칙 템플릿에 이 손님 값이 꽂힌 결과입니다. <mark>표시</mark>된 부분이 손님별 값이고,
       실제로 LLM 에 가는 문자열 그대로입니다.</p>
    <pre class="preview">${html}</pre>`;
}

async function resetOrder(o) {
  if (!confirm("이 손님의 편집을 되돌릴까요?")) return;
  await api("/api/admin/reset", { orderId: o.id });
  draftWants = null;
  await load();
}

async function save(payload) {
  const msg = $("#msg");
  try {
    S = await api("/api/admin/save", payload);
    draftWants = payload.fields?.wants ? structuredClone(order().wants) : draftWants;
    msg.textContent = "저장됨 · 대화와 채점에 바로 반영됩니다";
    msg.className = "status";
    renderNav();
  } catch (e) {
    msg.textContent = "저장 실패: " + e.message;
    msg.className = "status warn";
  }
}

// ── 대화 시험 ────────────────────────────────────────────────
function drawLog() {
  const o = view === "order" ? order() : null;
  const all = o ? [{ role: "monster", content: o.dialogue }, ...history] : [];
  $("#log").innerHTML = o
    ? all.map((m) => `<div class="msg ${m.role}">${esc(m.content)}</div>` + intentHtml(m)).join("")
    : `<div class="msg sys">왼쪽에서 손님을 고르면 여기서 대화로 시험할 수 있습니다.</div>`;
  $("#log").scrollTop = $("#log").scrollHeight;
}

// 손님이 슬롯마다 뭘 안다고 여기는지 — 프롬프트를 고칠 때 이게 흔들리면 바로 보인다
const SLOT_KO = { base: "시트반죽", sheetColor: "케이크 맛", toppings: "토핑",
                  cream: "생크림", deco: "데코", lettering: "레터링" };
function intentHtml(m) {
  if (m.role !== "monster") return "";
  if (m.raw !== undefined && m.intent == null) return `<div class="intent bad">구조 파싱 실패 — 원문을 대사로 씀</div>`;
  if (!m.intent) return "";
  const cls = (v) => v === "dont care" ? "care" : v === "unknown" ? "unk" : v === "none" ? "non" : "got";
  const rows = Object.entries(SLOT_KO).map(([k, ko]) => {
    const v = m.intent[k] ?? "unknown";
    return `<span class="i-slot ${cls(v)}"><b>${ko}</b> ${esc(v)}</span>`;
  }).join("");
  const bad = m.intentCheck
    ? `<div class="intent bad">정답과 어긋남 — ${esc(Object.entries(m.intentCheck)
        .map(([k, v]) => `${SLOT_KO[k] ?? k}: ${v}`).join(" · "))}</div>`
    : "";
  return `<div class="intent">${rows}</div>` + bad;
}

async function ask() {
  const text = $("#ask").value.trim();
  if (!text || view !== "order") return;
  const o = order();
  $("#ask").value = "";
  history.push({ role: "user", content: text });
  drawLog();
  $("#log").insertAdjacentHTML("beforeend", '<div class="msg monster">…</div>');
  try {
    const { reply, raw, intent, intentCheck } = await api("/api/chat", {
      orderId: o.id,
      history: [{ role: "monster", content: o.dialogue }, ...history],
    });
    history.push({ role: "monster", content: reply, raw, intent, intentCheck });
  } catch (e) {
    history.push({ role: "monster", content: "(에러) " + e.message });
  }
  drawLog();
}

$("#askBtn").onclick = ask;
$("#ask").onkeydown = (e) => e.key === "Enter" && ask();
$("#clearBtn").onclick = () => { history = []; drawLog(); };

load();
</script>
</body>
</html>
